worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 100m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    # 全局重定向：markwallpapers.cn → www.markwallpapers.cn
    server {
        listen 80;
        server_name markwallpapers.cn;
        return 301 $scheme://www.markwallpapers.cn$request_uri;
    }

    # 前端主站：www.markwallpapers.cn 和 IP 访问
    server {
        listen 80;
        server_name www.markwallpapers.cn 34.22.102.88;

        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;

        # 前端静态页面 markwallpapers
        location / {
            root /usr/share/nginx/html/markwallpapers;
            index index.html;
            try_files $uri $uri/ /index.html;
            expires 1d;
        }

        # API接口转发后端
        location /api/ {
            proxy_pass http://django_web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }

    # 控制台：console.markwallpapers.cn
    server {
        listen 80;
        server_name console.markwallpapers.cn;

        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;

        location / {
            root /usr/share/nginx/html/enhance;
            index index.html;
            try_files $uri $uri/ /index.html;
            expires 1d;
        }

        # 控制台接口转发后端（按需匹配后端路由）
        location /api/ {
            proxy_pass http://django_web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
}