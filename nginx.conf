worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 100m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    # 全部HTTP请求 80端口 强制跳转 HTTPS
    server {
        listen 80;

        server_name markwallpapers.com www.markwallpapers.com console.markwallpapers.com 34.22.102.88;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name www.markwallpapers.com;

        ssl_certificate /etc/nginx/cert/markwallpapers.com_bundle.crt;
        ssl_certificate_key /etc/nginx/cert/markwallpapers.com.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;

        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;

        # ========== 1. 精确匹配的SEO相关路径（最高优先级） ==========
        # robots.txt 动态接口
        location = /robots.txt {
            proxy_pass http://django_web:8000/api/site/robots-txt/?raw=1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
            expires 7d;
            add_header Content-Type "text/plain; charset=utf-8";
        }

        # Sitemap Index - /sitemap.xml
        location = /sitemap.xml {
            proxy_pass http://django_web:8000/api/seo/sitemap_urls/get-sitemap-xml/?raw=1&index=1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            types { }
            default_type application/xml;
            add_header Content-Type "application/xml; charset=utf-8" always;
        }

        location ~ ^/sitemap-(article|category|tag|page)\.xml$ {
            proxy_pass http://django_web:8000/api/seo/sitemap_urls/get-sitemap-xml/?raw=1&type=$1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            types { }
            default_type application/xml;
            add_header Content-Type "application/xml; charset=utf-8" always;
        }

        # 静态分片sitemap
        location ~ ^/detail-sitemap-(\d+)\.xml$ {
            root /usr/share/App/view/seo/sitemap/sitemap_files;
            try_files detail-sitemap-$1.xml =404;
            access_log off;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
            add_header Content-Type "application/xml; charset=utf-8";
            default_type application/xml;
            open_file_cache max=1000 inactive=60m;
            open_file_cache_valid 10m;
            open_file_cache_min_uses 2;
            open_file_cache_errors on;
        }

        # ========== 2. 静态资源文件（优先匹配，避免被SPA路由拦截） ==========
        # 常见静态资源后缀
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|webp|avif|mp4|webm)$ {
            root /usr/share/nginx/html/markwallpapers;
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        # 修复多级路由 /wallpaper/assets/xxx
        location ~* ^/wallpaper/assets/(.*)$ {
            alias /usr/share/nginx/html/markwallpapers/assets/$1;
            expires 7d;
            add_header Cache-Control "public";
        }

        # 通用assets目录
        location ~* ^/assets/ {
            root /usr/share/nginx/html/markwallpapers;
            expires 7d;
            add_header Cache-Control "public";
        }

        # ========== 3. SPA路由处理（核心修复） ==========
        # /privacy/ 精确路径重定向
        location = /privacy {
            return 301 /privacy/;
        }

        # /privacy/ 下的所有路径交给前端SPA
        location ^~ /privacy/ {
            root /usr/share/nginx/html/markwallpapers;
            index index.html;
            try_files $uri $uri/ /index.html;
            expires 1d;
        }

        # /wallpaper/ 下的所有路径交给前端SPA
        location ^~ /wallpaper/ {
            root /usr/share/nginx/html/markwallpapers;
            index index.html;
            try_files $uri $uri/ /index.html;
            expires 1d;
        }

        # ========== 4. 默认SPA路由（兜底） ==========
        location / {
            root /usr/share/nginx/html/markwallpapers;
            index index.html;
            try_files $uri $uri/ /index.html;
            expires 1d;
        }

        # ========== 5. API转发（最后匹配） ==========
        location /api/ {
            proxy_pass http://django_web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }

    # HTTPS 裸域名 markwallpapers.com 跳转 www
    server {
        listen 443 ssl;
        server_name markwallpapers.com;

        ssl_certificate /etc/nginx/cert/markwallpapers.com_bundle.crt;
        ssl_certificate_key /etc/nginx/cert/markwallpapers.com.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;

        return 301 https://www.markwallpapers.com$request_uri;
    }

    # HTTPS 控制台 console.markwallpapers.com
    server {
        listen 443 ssl;
        server_name console.markwallpapers.com;

        ssl_certificate /etc/nginx/cert/markwallpapers.com_bundle.crt;
        ssl_certificate_key /etc/nginx/cert/markwallpapers.com.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;

        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;

        location / {
            root /usr/share/nginx/html/enhance;
            index index.html;
            try_files $uri $uri/ /index.html;
            expires 1d;
        }

        location /api/ {
            proxy_pass http://django_web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
}