worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 100m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    # 全部HTTP请求 80端口 强制跳转 HTTPS
    server {
        listen 80;

        server_name markwallpapers.com www.markwallpapers.com console.markwallpapers.com 34.22.102.88;
        return 301 https://$host$request_uri;
    }

    # HTTPS 主站 www.markwallpapers.com
    server {
        listen 443 ssl;
        server_name www.markwallpapers.com;

        ssl_certificate /etc/nginx/cert/markwallpapers.com_bundle.crt;
        ssl_certificate_key /etc/nginx/cert/markwallpapers.com.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;

        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;

        location ^~ /privacy/ {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ index.html;
            expires 1d;
        }
        location = /privacy {
            return 301 /privacy/;
        }

        # 主站前端
        location / {
            root /usr/share/nginx/html/markwallpapers;
            index index.html;
            try_files $uri $uri/ /index.html;
            expires 1d;
        }

        # API转发后端
        location /api/ {
            proxy_pass http://django_web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }

    # HTTPS 裸域名 markwallpapers.com 跳转 www
    server {
        listen 443 ssl;
        server_name markwallpapers.com;

        ssl_certificate /etc/nginx/cert/markwallpapers.com_bundle.crt;
        ssl_certificate_key /etc/nginx/cert/markwallpapers.com.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;

        return 301 https://www.markwallpapers.com$request_uri;
    }

    # HTTPS 控制台 console.markwallpapers.com
    server {
        listen 443 ssl;
        server_name console.markwallpapers.com;

        ssl_certificate /etc/nginx/cert/markwallpapers.com_bundle.crt;
        ssl_certificate_key /etc/nginx/cert/markwallpapers.com.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;

        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;

        location / {
            root /usr/share/nginx/html/enhance;
            index index.html;
            try_files $uri $uri/ /index.html;
            expires 1d;
        }


        location /api/ {
            proxy_pass http://django_web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
}