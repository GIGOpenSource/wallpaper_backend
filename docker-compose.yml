services:
  django_web:
    build:
      context: .
      cache_from:
        - wallpaper_backend-django_web:latest
    container_name: wallpaper_django_overseas
    restart: always
    env_file:
      - .env
    volumes:
      - ./media:/app/media
      - ./logs:/app/logs
      - ./resource:/app/resource
      - ./App/view/seo/sitemap/sitemap_files:/app/App/view/seo/sitemap/sitemap_files
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: wallpaper_nginx_overseas
    restart: always
    ports:
      - "80:80"
      - "443:443" # 新增HTTPS端口映射
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./staticfiles:/usr/share/nginx/html/static:ro
      - ./App/view/seo/sitemap/sitemap_files:/usr/share/App/view/seo/sitemap/sitemap_files
      - ./page/markwallpapers:/usr/share/nginx/html/markwallpapers:ro
      - ./page/enhance:/usr/share/nginx/html/enhance:ro
      - ./page/privacy:/usr/share/nginx/html/privacy:ro
      - ./page/cert:/etc/nginx/cert:ro
      - ./page/agreement:/usr/share/nginx/html/agreement:ro
    depends_on:
      - django_web
    networks:
      - app_network
      -
  db:
    image: postgres:16-alpine
    container_name: wallpaper_db
    environment:
      - POSTGRES_DB=wallpaper_db
      - POSTGRES_USER=wallpaper123
      - POSTGRES_PASSWORD=wallpaper123
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - wallpaper_net
    restart: unless-stopped
    shm_size: 1g
    cpus: '3'
    mem_limit: 2g
    mem_reservation: 1g
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U wallpaper123 -d wallpaper_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wallpaper_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - wallpaper_net
    restart: unless-stopped
    command: >
      redis-server
      --requirepass Redis@2026#0119
      --protected-mode yes
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
      --rename-command CONFIG ""
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "Redis@2026#0119", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  app_network: