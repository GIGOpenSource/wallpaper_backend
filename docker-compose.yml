services:
  django_web:
    build: .
    container_name: wallpaper_django_overseas
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./:/app          # ✅ 全挂载 /app，不会影响 /venv（在根目录，不在/app内）
      - ./media:/app/media
      - ./logs:/app/logs
    networks:
      - app_network
    # ✅ 调用 /venv 下的 python，不再用 /app/venv
    command: ["/venv/bin/python", "manage.py", "runserver", "0.0.0.0:8000"]

  nginx:
    image: nginx:alpine
    container_name: wallpaper_nginx_overseas
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./staticfiles:/usr/share/nginx/html/static:ro
    depends_on:
      - django_web
    networks:
      - app_network

networks:
  app_network: