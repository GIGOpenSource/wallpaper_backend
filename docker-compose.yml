version: '3.8'

services:
  django_web:
    build: .
    container_name: wallpaper_django_overseas
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=WallPaper.settings.pro
      # === 外部老数据库配置（务必修改为真实地址信息）===
      - DB_HOST=你的老数据库IP/域名
      - DB_PORT=5432
      - DB_NAME=老数据库名
      - DB_USER=老数据库账号
      - DB_PASSWORD=老数据库密码
      # === 外部老Redis配置（务必修改为真实地址信息）===
      - REDIS_HOST=你的老RedisIP/域名
      - REDIS_PORT=6379
      - REDIS_PASSWORD=老Redis密码
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: wallpaper_nginx_overseas
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./staticfiles:/usr/share/nginx/html/static:ro
    depends_on:
      - django_web
    networks:
      - app_network

networks:
  app_network: