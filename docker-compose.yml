services:
  django_web:
    build:
      context: .
      cache_from:
        - wallpaper_backend-django_web:latest  # BuildKit镜像缓存
    container_name: wallpaper_django_overseas
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # ✅精准挂载可变目录，不要全量挂载 /app
      - ./media:/app/media
      - ./logs:/app/logs
      - ./resource:/app/resource
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: wallpaper_nginx_overseas
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./staticfiles:/usr/share/nginx/html/static:ro
    depends_on:
      - django_web
    networks:
      - app_network

networks:
  app_network: